[project]
name = "minimax-shorts"
version = "0.1.0"
description = "Product photos + selling points -> storyboard (MiniMax M3) -> short vertical video (MiniMax H3)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # full-width Chinese punctuation is intentional

[tool.ruff.lint.per-file-ignores]
"core/storyboard.py" = ["E501"]  # long lines are Chinese prompt prose
"core/qc.py" = ["E501"]
